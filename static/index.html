<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vidgen studio</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1f232c;--line:#2b303b;--text:#e6e8ee;--muted:#8b93a5;--accent:#e0a85a;--ok:#5cc98a;--bad:#e46a6a;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,Segoe UI,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
a,a:visited{color:#8fc8ff;text-decoration:none}a:hover{color:#c4e2ff;text-decoration:underline}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#1a1205;border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
textarea{width:100%;resize:vertical}
header{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0;letter-spacing:.5px}
header h1 span{color:var(--accent)}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{border-radius:20px}
nav button.on{background:var(--accent);color:#1a1205;border-color:var(--accent)}
main{max-width:1280px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--text)}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--panel2)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
.part-h{display:flex;align-items:baseline;gap:10px;margin:24px 0 10px}
.part-h h3{margin:0;font-size:15px}
.scene{display:grid;grid-template-columns:320px 1fr;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.thumb{aspect-ratio:16/9;background:#0c0e12;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb{text-align:center}
.strip{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;align-items:center}
.mini{width:58px;aspect-ratio:16/9;border-radius:5px;overflow:hidden;background:#0c0e12;border:2px solid var(--line);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);padding:0}
.mini.on{border-color:var(--accent)}.mini img{width:100%;height:100%;object-fit:cover}
.mini.add{font-size:18px;border-style:dashed}
.thumb .bgblur,.fbox .bgblur{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(14px) brightness(.85);transform:scale(1.1)}
.thumb .fg,.fbox .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.fbox{position:relative;aspect-ratio:16/9;width:100%;max-width:760px;margin:0 auto;background:#000;border-radius:8px;overflow:hidden;
  touch-action:none;user-select:none}
.fbox img.cov{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.fbox.drag{cursor:grab}.fbox.drag:active{cursor:grabbing}
.fbox .hint{position:absolute;left:8px;bottom:8px;background:#000a;padding:2px 8px;border-radius:6px;font-size:12px}
@keyframes scrollY{from{object-position:50% 0%}to{object-position:50% 100%}}
@keyframes scrollX{from{object-position:0% 50%}to{object-position:100% 50%}}
.lp{position:relative;aspect-ratio:16/9;width:100%;background:#000;border-radius:8px;overflow:hidden}
.lp .ly{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
.lp .ly img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lp .ly img.fg{object-fit:contain}
.lp .ly img.bgblur{filter:blur(14px) brightness(.8);transform:scale(1.1)}
.lp .ly .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8%;text-align:center;
  background:#2a3550;color:#ddd;font-size:15px}
.lp .blk{position:absolute;inset:0;background:#000;pointer-events:none;z-index:900}
.lp .ttl{position:absolute;left:50%;top:80%;transform:translate(-50%,-50%);background:#0008;color:#fff;padding:.4em .9em;
  font:600 clamp(14px,3vw,30px) Georgia,serif;border-radius:4px;opacity:0;white-space:nowrap;z-index:901}
.lp .info{position:absolute;left:8px;top:8px;background:#000a;color:#fff;padding:2px 8px;border-radius:6px;font-size:12px;z-index:902}
.lpbar{display:flex;gap:8px;align-items:center;margin-top:8px}.lpbar input[type=range]{flex:1}
.idea{border:1px solid #ffffff1f;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.idea b{font-size:15px}.idea .yt{font-size:12px;background:var(--panel2);border-radius:8px;padding:6px 8px;color:var(--text);line-height:1.5}.idea .yt a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lv{padding:0 6px;border-radius:5px;font-weight:600;font-size:11px}.lv-g{background:#5cc98a33;color:#7ee0a6}.lv-y{background:#e0a85a33;color:#f0c27e}.lv-r{background:#e46a6a33;color:#ff9b9b}.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:10px}
.step{display:inline-block;background:#f0b13a;color:#000;border-radius:50%;width:24px;height:24px;text-align:center;line-height:24px;margin-right:6px;font-weight:700}
.research{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.sug{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sug .th{display:flex;gap:6px;flex-wrap:wrap;width:330px;flex-shrink:0}
.sug .th img{width:104px;height:68px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
.sug .th img:hover{border-color:var(--accent)}
.sug code{font-size:12px;background:var(--panel2);padding:1px 6px;border-radius:5px}
@media (max-width:700px){.sug{flex-direction:column}.sug .th{width:auto}}
.narr mark{background:#e0a85a55;color:inherit;border-radius:3px;padding:0 2px}
.seg{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.seg .th{display:flex;gap:6px;flex-wrap:wrap;width:330px;flex-shrink:0;align-content:flex-start}
.seg .th img{width:104px;height:68px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
.seg .th img:hover{border-color:var(--accent)}.seg .cur{width:216px;height:122px;object-fit:cover;border-radius:8px}
@media (max-width:700px){.seg{flex-direction:column}.seg .th{width:auto}}
.sz{font-size:11px;font-weight:600;padding:0 5px;border-radius:4px;white-space:nowrap}
.sz.g{background:#5cc98a33;color:#7ee0a6}.sz.y{background:#e0a85a33;color:#f0c27e}.sz.r{background:#e46a6a33;color:#ff9b9b}
.thw{position:relative;display:inline-block}.thw .sz{position:absolute;left:3px;bottom:3px;background:#000b}
#lightbox .lb{position:fixed;inset:0;background:#000d;z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px}
#lightbox .lbin{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:min(1400px,100%);width:100%;
  max-height:100%;display:flex;flex-direction:column;overflow:hidden}
#lightbox .lbview{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;position:relative}
#lightbox .lbview img{max-width:100%;max-height:72vh;object-fit:contain;display:block}
#lightbox .lbview .f169{width:min(100%,128vh);aspect-ratio:16/9;max-height:72vh;position:relative;overflow:hidden}
#lightbox .lbview .f169 img{width:100%;height:100%;max-height:none;object-fit:cover}
#lightbox .lbbar{padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
#lightbox .lbload{position:absolute;right:10px;top:10px;background:#000b;padding:2px 8px;border-radius:6px;font-size:12px}
.badge{position:absolute;right:6px;top:6px;background:#000a;padding:0 6px;border-radius:6px;font-size:12px}.thumb.over{outline:2px dashed var(--accent);outline-offset:-4px}
.thumb .sid{position:absolute;left:6px;top:6px;background:#000a;padding:0 6px;border-radius:6px;font-size:12px}
.credit{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.narr{font-size:13px;color:#c5cad6;background:#0c0e12;border-radius:8px;padding:8px;margin-bottom:8px}
.fields label{display:block;font-size:12px;color:var(--muted);margin:6px 0 2px}
.fields input{width:100%}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.progress{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:10px 0}
.progress div{height:100%;background:var(--accent);width:0;transition:width .3s}
pre.log{background:#0c0e12;border-radius:8px;padding:10px;max-height:260px;overflow:auto;font-size:12px;white-space:pre-wrap;margin:0}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal>div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);width:min(1100px,100%);max-height:92vh;display:flex;flex-direction:column}
.modal .mh{padding:14px 16px;border-bottom:1px solid var(--line)}
.modal .mb{padding:14px 16px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.cand{background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer}
.cand:hover{border-color:var(--accent)}
.cand img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.cand div{padding:6px 8px;font-size:11px;color:var(--muted)}
.cand.portrait img{object-fit:contain;background:#000}
.toast{position:fixed;right:16px;bottom:16px;background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:8px;z-index:30;max-width:420px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.form-grid label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
video{width:100%;border-radius:var(--r);background:#000}
.srcs label{display:inline-flex;gap:4px;align-items:center;margin-right:12px}
@media(max-width:760px){.scene{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>vid<span>gen</span> studio</h1>
  <select id="projSel"></select>
  <button onclick="newProject()">+ Project</button>
  <nav id="nav">
    <button data-tab="idea">⓪ Ý tưởng</button>
    <button data-tab="data">① Dữ liệu</button>
    <button data-tab="scenes">② Cảnh & Ảnh</button>
    <button data-tab="render">③ Render</button>
    <button data-tab="settings">⚙ Nguồn ảnh</button>
  </nav>
</header>
<main id="main"></main>
<div id="modalRoot"></div>
<audio id="player"></audio>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = t => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
let S = {project: null, state: null, tab: 'data', settings: null, job: null};
try { S.project = localStorage.getItem('vg_project'); S.tab = localStorage.getItem('vg_tab') || 'data'; } catch {}

async function api(path, opt = {}) {
  if (opt.json !== undefined) { opt.body = JSON.stringify(opt.json); opt.headers = {'Content-Type': 'application/json'}; }
  const r = await fetch(path, opt);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || r.statusText);
  return d;
}
function toast(msg, ms = 3500) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
const P = () => `/api/projects/${encodeURIComponent(S.project)}`;

async function loadProjects() {
  const list = await api('/api/projects');
  if (!list.includes(S.project)) S.project = list[0] || null;
  $('#projSel').innerHTML = list.map(n => `<option ${n === S.project ? 'selected' : ''}>${esc(n)}</option>`).join('');
}
$('#projSel').onchange = e => { S.project = e.target.value; save(); refresh(); };
async function newProject() {
  modal(`<div class="mh"><b>Project mới</b></div><div class="mb row">
     <input id="npName" placeholder="ví dụ: dragon fruit" style="flex:1" onkeydown="if(event.key==='Enter')createProject(this.value)">
     <button class="primary" onclick="createProject($('#npName').value)">Tạo</button>
     <button onclick="closeModal()">Huỷ</button></div>`);
  $('#npName').focus();
}
async function createProject(name) {
  if (!name?.trim()) return;
  try { const r = await api('/api/projects', {method: 'POST', json: {name}}); S.project = r.name; closeModal(); save();
        await loadProjects(); setTab('data'); } catch (e) { toast(e.message); }
}
function save() { try { localStorage.setItem('vg_project', S.project || ''); localStorage.setItem('vg_tab', S.tab); } catch {} }

document.querySelectorAll('#nav button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
function setTab(t) { S.tab = t; save(); document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t)); refresh(); }

async function refresh() {
  try { await refreshTab(); }
  catch (e) {
    $('#main').innerHTML = `<div class="card"><h2>Không tải được tab này</h2><p class="tag bad">${esc(e.message)}</p>
      <p class="muted">Nếu lỗi là "Not Found": server đang chạy bản cũ — tắt cửa sổ start.bat, mở lại, rồi F5.</p></div>`;
  }
}
async function refreshTab() {
  if (S.tab === 'settings') return renderSettings();
  if (S.tab === 'idea') return renderIdea();
  if (!S.project) { $('#main').innerHTML = `<div class="card">Chưa có project. Bấm <b>+ Project</b> để tạo.</div>`; return; }
  S.state = await api(P());
  ({data: renderData, scenes: renderScenes, render: renderRender})[S.tab]();
}

/* ---------------- ⓪ IDEA: topic -> script -> voices ---------------- */
async function renderIdea() {
  const d = await api('/api/ideas');
  S.ideas = d.ideas;
  const sc = S.project ? await api(`${P()}/script`).catch(() => ({text: ''})) : {text: ''};
  const ro = (() => { try { return JSON.parse(localStorage.getItem('vg_idea') || '{}'); } catch { return {}; } })();
  const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : n;
  $('#main').innerHTML = `
  <div class="card"><h2><span class="step">1</span>Chọn chủ đề</h2>
    <p class="muted">AI gợi ý loại quả đang được chú ý và có lịch sử thú vị (bỏ qua các project đã làm: ${esc(d.done.join(', ') || '—')}).</p>
    <div class="row">
      <select id="iSite"><option value="gemini">Gemini web (có tìm web)</option><option value="chatgpt">ChatGPT web</option><option value="grok">Grok web</option><option value="api_gemini">Gemini API ${d.api_keys.api_gemini ? '' : '(cần key)'}</option><option value="api_openai">OpenAI API ${d.api_keys.api_openai ? '' : '(cần key)'}</option></select>
      <button class="primary" onclick="suggestIdeas()">✨ Gợi ý chủ đề</button>
      ${d.ideas.length ? `<button onclick="checkYT()">📈 Kiểm tra độ cạnh tranh trên YouTube${d.youtube_key ? '' : ' 🔑'}</button>` : ''}
    </div>
    <div class="row" style="margin-top:8px">
      <input id="rFruit" placeholder="Hoặc nhập quả bạn muốn làm — vd: jackfruit" style="flex:1;min-width:200px"
        onkeydown="if(event.key==='Enter')researchFruit()">
      <button class="primary" onclick="researchFruit()">🔎 Nghiên cứu đối thủ</button>
      <span class="muted" style="font-size:12px">YouTube thật (view, kênh) + AI phân tích góc kể, 3 tiêu đề (tiêu đề + hashtags ≤ 100 ký tự)</span></div>
    <div id="ideaJob"></div>
    <div class="ideas">${d.ideas.map((x, i) => `<div class="idea">
      <b>${esc(x.fruit)}</b><span>${esc(x.title || '')}</span>
      <span class="muted" style="font-size:13px">${esc(x.hook || '')}</span>
      <span style="font-size:12px">🔥 ${esc(x.why_now || '')}</span>
      ${x.covered ? `<span style="font-size:12px">⚔ Đối thủ đã làm: ${esc(x.covered)}</span>` : ''}
      ${x.angle ? `<span style="font-size:12px">🎯 Góc của mình: <b style="font-size:12px">${esc(x.angle)}</b></span>` : ''}
      ${(x.titles || []).length ? `<div style="font-size:12px">${x.titles.map((t, j) => `<div style="margin:3px 0">
        <a href="#" onclick="pickIdea(${i},${j});return false" title="Chọn tiêu đề này">✏ ${esc(t.title)} <span class="muted">${esc(t.hashtags)}</span></a>
        <span class="${t.len > 100 ? 'tag bad' : 'muted'}" style="font-size:11px">${t.len}/100</span></div>`).join('')}</div>` : ''}
      ${x.yt && x.yt.verdict ? `<div class="yt">
        <div style="font-size:13px;margin-bottom:4px">${x.yt.verdict[0]} <b style="font-size:13px">${esc(x.yt.verdict[1])}</b></div>
        Nhu cầu <span class="lv lv-${lvc(x.yt.demand, 1)}">${x.yt.demand}</span>
        · Cạnh tranh <span class="lv lv-${lvc(x.yt.competition, 0)}">${x.yt.competition}</span>
        <div class="muted" style="font-size:11px;margin:2px 0 4px">${x.yt.long_count} video dài liên quan · ${x.yt.strong} video >100K view
          · video dài top ${fmtN(x.yt.top_long_views)}${x.yt.shorts_top ? ` · Shorts top ${fmtN(x.yt.shorts_top)}` : ''}</div>
        ${x.yt.videos.map(v => `<a href="${esc(v.url)}" target="_blank" title="${esc(v.title)} — ${esc(v.channel)} · ${v.minutes} phút · ${v.date}">▶ ${fmtN(v.views)} · ${esc(v.title)}</a>`).join('')}</div>`
      : x.yt ? `<div class="yt muted">Số liệu cũ — bấm 📈 Kiểm tra lại</div>` : ''}
      <div><button onclick="pickIdea(${i})">Chọn →</button></div></div>`).join('')}</div>
  </div>
  <div class="card"><h2><span class="step">2</span>Kịch bản</h2>
    <div class="form-grid">
      <label>Chủ đề (= tên project)<input id="iTopic" value="${esc(ro.topic || '')}" placeholder="ví dụ: dragon fruit"></label>
      <label>Tiêu đề video<input id="iTitle" value="${esc(ro.title || '')}" placeholder="The History of ..."></label>
      <label>Số part<input id="iParts" type="number" value="${ro.parts || 10}" min="3" max="20"></label>
      <label>Độ dài (phút)<input id="iMin" type="number" value="${ro.minutes || 9}" min="2" max="30"></label>
      <label>AI viết<select id="iSite2"><option value="gemini">Gemini web</option><option value="chatgpt">ChatGPT web (cần đăng nhập)</option><option value="grok">Grok web</option><option value="api_gemini">Gemini API ${d.api_keys.api_gemini ? '' : '(cần key)'}</option><option value="api_openai">OpenAI API ${d.api_keys.api_openai ? '' : '(cần key)'}</option></select></label>
    </div>
    <div class="row" style="margin-top:10px"><button class="primary" onclick="genScript()">📝 Tạo kịch bản</button>
      <span class="muted" style="font-size:12px">Tạo project mới (nếu chưa có), AI viết đúng định dạng Part + [pause]. Mất 1–3 phút.</span></div>
    <div id="scriptJob"></div>
    ${S.project ? `<label style="margin-top:12px;display:block">Kịch bản của project <b>${esc(S.project)}</b> ${sc.name ? `<span class="muted">(${esc(sc.name)})</span>` : '— chưa có'}
      <span class="muted">· đọc lại, sửa số liệu nếu cần, rồi Lưu</span></label>
      <textarea id="iScript" rows="14" style="font-family:ui-monospace,monospace;font-size:13px">${esc(sc.text)}</textarea>
      <div class="row" style="margin-top:6px"><button onclick="saveScriptText()">💾 Lưu kịch bản</button></div>` : ''}
  </div>
  <div class="card" id="voiceCard"></div>`;
  $('#iSite2').value = ro.site || 'gemini';
  ['iTopic', 'iTitle', 'iParts', 'iMin', 'iSite2'].forEach(id => $('#' + id).addEventListener('change', saveIdeaForm));
  renderVoiceCard(!!sc.text);
}
function saveIdeaForm() {
  const o = {topic: $('#iTopic').value, title: $('#iTitle').value, parts: +$('#iParts').value, minutes: +$('#iMin').value,
             site: $('#iSite2').value, hashtags: $('#iTitle').dataset.hashtags || ''};

function dropZone(sel, accept, multiple, cb) {
  const el = $(sel), inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept; inp.multiple = multiple; inp.onchange = () => cb([...inp.files]);
  el.onclick = () => inp.click();
  el.ondragover = e => { e.preventDefault(); el.classList.add('over'); };
  el.ondragleave = () => el.classList.remove('over');
  el.ondrop = e => { e.preventDefault(); el.classList.remove('over'); cb([...e.dataTransfer.files]); };
}

/* ---------------- jobs ---------------- */
function watchJob(job, box, onDone, onError) {
  S.job = job.id;
  $(box).innerHTML = `<div class="progress"><div id="pb"></div></div><pre class="log" id="lg">bắt đầu…\n</pre>
    <button id="jobCancel" hidden onclick="api('/api/jobs/${job.id}/cancel',{method:'POST'}).then(()=>toast('Đã huỷ'))">✕ Huỷ (đang chờ)</button>`;
  let since = 0;
  const tick = async () => {
    const j = await api(`/api/jobs/${job.id}?since=${since}`);
    since = j.log_count;
    const lg = $('#lg'); if (!lg) return;
    if (j.logs.length) { lg.textContent += j.logs.join('\n') + '\n'; lg.scrollTop = lg.scrollHeight; }
    const cb = $('#jobCancel'); if (cb) cb.hidden = !(j.status === 'running' && !j.started);
    $('#pb').style.width = (j.progress * 100) + '%';
    if (j.status === 'running') return setTimeout(tick, 1000);
    S.job = null;
    if (j.status === 'error') { toast('Lỗi: ' + j.error, 10000); onError && onError(j); return; }
    onDone && onDone();
  };
  tick();
}

  if (FR.fit === 'scroll') {

    const im = $('#fimg');
    const anim = () => { const tall = im.naturalWidth / im.naturalHeight < 16 / 9;
      im.style.animation = `${tall ? 'scrollY' : 'scrollX'} 5s ease-in-out infinite ${FR.dir === 'back' ? 'alternate-reverse' : 'alternate'}`; };
    if (im.complete) anim(); else im.onload = anim;

  box.innerHTML = `<img class="cov" id="fimg" src="${FR.image}"><span class="hint">kéo ảnh để chọn vùng hiển thị</span>`;

  const list = sel === '*' ? Object.entries(S.settings.sources).filter(([, v]) => v.kind === 'search' && v.enabled).map(([k]) => k) : [sel];
  CANDS = []; $('#results').innerHTML = ''; $('#smsg').textContent = 'Đang tìm…';
  saveScene(baseId(sid), {query: q}); const qi = $('#q_' + baseId(sid)); if (qi) qi.value = q;
  await Promise.all(list.map(async s => {
    try {
      const r = await api(`/api/search?source=${s}&q=${encodeURIComponent(q)}&n=16`);
      r.forEach(c => CANDS.push(c)); drawCands(sid);
    } catch (e) { $('#smsg').textContent += ` ${e.message}`; }
  }));
  $('#smsg').textContent = CANDS.length ? `Ảnh lớn (≥1920×1280, ngang) xếp trước. Bấm ảnh để xem lớn rồi ✓ Chọn (Enter).` : 'Không có kết quả — thử từ khoá ngắn hơn / tiếng Anh.';
}

async function dropOnScene(e, sid) {
  e.preventDefault(); e.currentTarget?.classList?.remove('over');
  const dt = e.dataTransfer;
  if (dt.files && dt.files.length) {
    const fd = new FormData(); fd.append('file', dt.files[0]);
    try { await api(`${P()}/scene/${sid}/upload`, {method: 'POST', body: fd}); closeModal(); refreshScene(sid); }
    catch (err) { toast(err.message); }
    return;
  }
  // image dragged from another tab: prefer the <img src> inside the dragged HTML, else the URL
  const htmlSrc = (dt.getData('text/html').match(/<img[^>]+src="([^"]+)"/i) || [])[1];
  let url = htmlSrc || dt.getData('text/uri-list') || dt.getData('text/plain');
  url = (url || '').split(/\r?\n/)[0].trim().replace(/&amp;/g, '&');
  // Google Images result links wrap the real image: ...imgurl=<url>&...
  const m = url.match(/[?&]imgurl=([^&]+)/); if (m) url = decodeURIComponent(m[1]);
  if (/^data:image\//.test(url)) {
    const blob = await (await fetch(url)).blob(); const fd = new FormData(); fd.append('file', blob, 'drop.jpg');
    await api(`${P()}/scene/${sid}/upload`, {method: 'POST', body: fd}); closeModal(); refreshScene(sid); return;
  }
  if (!/^https?:\/\//.test(url)) return toast('Không đọc được ảnh vừa thả — thử chuột phải → Sao chép địa chỉ hình ảnh rồi dán link');
  pickUrl(sid, url);
}
/* Ctrl+V: paste a copied image (or an image link) into the scene whose search box is open,
   otherwise into the scene card under the mouse. */
let hoverSid = null, modalSid = null;
document.addEventListener('mouseover', e => { const c = e.target.closest?.('.scene'); if (c) hoverSid = c.id.replace('sc_', ''); });
document.addEventListener('paste', async e => {
  let sid = ($('#modalRoot').innerHTML && modalSid) || (S.tab === 'scenes' && hoverSid);
  if (sid && sid === hoverSid && !modalSid) { const [, s] = findScene(sid); if (s) sid = curShot(s).id; }
  if (!sid) return;
  const typing = e.target.matches?.('input, textarea') && e.target.id !== 'pasteUrl';
  const items = [...(e.clipboardData?.items || [])];
  const img = items.find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (img) {
    e.preventDefault();
    const fd = new FormData(); fd.append('file', img.getAsFile(), 'pasted.png');
    toast(`Đang dán ảnh vào ${sid}…`);
    try { await api(`${P()}/scene/${sid}/upload`, {method: 'POST', body: fd}); closeModal(); refreshScene(sid); toast(`${sid}: đã dán ảnh`); }
    catch (err) { toast(err.message); }
    return;
  }
  if (typing) return;  // normal text paste into prompt/query fields
  const text = (e.clipboardData?.getData('text/plain') || '').trim();
  if (/^https?:\/\/\S+$/.test(text)) { e.preventDefault(); pickUrl(sid, text); }
});

const MP = {mode: null, key: null};  // what the shared #player holds for the music buttons

  if (a) { a.textContent = on('track') ? '⏸' : '▶'; a.title = on('track') ? 'Tạm dừng' : 'Nghe bản nhạc'; }

async function musicToggle(mode, key, url, msg) {

    if (!pl.paused) return pl.pause();
    if (!pl.ended) { try { await pl.play(); } catch (e) { toast(e.message); } return; }
  }
  MP.mode = mode; MP.key = key;

    try { const r = await api('/api/music', {method: 'POST', body: fd}); await loadMusic(); $('#o_music').value = r.id;
          $('#o_music').dispatchEvent(new Event('change')); toast('Đã thêm nhạc'); } catch (e) { toast(e.message); } };
  inp.click();
}
/* ---- instant preview: plays the voice and animates the same timeline the renderer uses (no rendering) ---- */
const KB = {  // effect -> progress p -> [zoom, anchorX, anchorY]; same maths as vidgen.zoompan_expr
  zoom_in: (p, Z, a, b) => [1 + (Z - 1) * p, a, b], zoom_out: (p, Z, a, b) => [Z - (Z - 1) * p, a, b],
  pan_right: (p, Z, a, b) => [Z, p, b], pan_left: (p, Z, a, b) => [Z, 1 - p, b],
  pan_up: (p, Z, a, b) => [Z, a, 1 - p], pan_down: (p, Z, a, b) => [Z, a, p],
  zoom_in_tl: (p, Z) => [1 + (Z - 1) * p, .3, .3], zoom_in_br: (p, Z) => [1 + (Z - 1) * p, .7, .7],
  zoom_out_tl: (p, Z) => [Z - (Z - 1) * p, .3, .3], zoom_in_drift: (p, Z, a, b) => [1 + (Z - 1) * p, .35 + .3 * p, b],
  static: (p, Z, a, b) => [1, a, b]};
let LP = null;
function stopLive() { if (LP) { LP.stop = true; LP.audio.pause(); LP = null; } }
function layerHtml(x) {
  if (!x.image) return `<div class="ph">${esc(x.text.slice(0, 160))}</div>`;
  const f = x.framing || {};
  if (f.fit === 'contain') return `<img class="bgblur" src="${x.image}"><img class="fg sc" src="${x.image}">`;
  const pos = f.fit === 'cover' ? `${(f.fx ?? .5) * 100}% ${(f.fy ?? .5) * 100}%` : '50% 0%';
  return `<img class="sc" src="${x.image}" style="object-position:${pos}">`;
}
async function livePreview(what) {
  stopLive();
  let tl;
  try { tl = await api(`${P()}/timeline`, {method: 'POST', json: {...renderOpts(), part: what.part || +what.scene.slice(1).split('_')[0]}}); }
  catch (e) { toast(e.message); return; }
  const XF = tl.xfade, sh = tl.shots, n = sh.length;
  let from = 0, to = tl.duration;
  if (what.scene) {
    const mine = sh.filter(x => x.id === what.scene || x.id.startsWith(what.scene + '_'));
    from = Math.max(0, mine[0].start - 0.5); to = Math.min(tl.duration, mine[mine.length - 1].end + XF);
  }
  modal(`<div class="mh row"><b>⚡ Xem tức thì — ${what.scene ? 'cảnh ' + what.scene : 'Part ' + tl.num}</b>
      <span class="muted" style="font-size:12px">Không cần render · theo cài đặt tab ③ · chuyển cảnh hiển thị dạng mờ dần</span></div>
    <div class="mb"><div class="lp" id="lp">
      ${sh.map((x, i) => `<div class="ly" id="ly${i}">${layerHtml(x)}</div>`).join('')}
      <div class="ttl" id="lpT">Part ${tl.num}. ${esc(tl.title)}</div><div class="blk" id="lpB"></div><span class="info" id="lpI"></span></div>
      <div class="lpbar"><button id="lpP">▶</button><input type="range" id="lpR" min="${from}" max="${to}" step="0.05" value="${from}">
        <span id="lpC" class="muted" style="font-variant-numeric:tabular-nums"></span></div>
      <div class="row" style="margin-top:10px">
        <button onclick="stopLive();preview(${esc(JSON.stringify(what))})" title="Render thật 480p để xem đúng kiểu chuyển cảnh">🎬 Render nháp 480p</button>
        ${what.scene ? `<button onclick="livePreview({part:${tl.num}})">Xem cả Part ${tl.num}</button>` : ''}
        <button onclick="stopLive();closeModal()">Đóng</button></div></div>`);
  const audio = new Audio(tl.voice);
  const me = LP = {audio, stop: false, playing: false};
  const layers = sh.map((x, i) => $('#ly' + i)), ratio = {};
  layers.forEach((ly, i) => { const im = ly.querySelector('img.sc');
    if (im) { const set = () => { ratio[i] = im.naturalWidth / im.naturalHeight; }; im.complete ? set() : im.onload = set; } });
  const draw = t => {
    let cur = 0;
    for (let i = 0; i < n; i++) {
      const x = sh[i], d = x.end - x.start + (i < n - 1 ? XF : 0), ly = layers[i];
      if (t < x.start || t > x.start + d) { ly.style.opacity = 0; continue; }
      cur = i;
      ly.style.opacity = i === 0 ? 1 : Math.min(1, (t - x.start) / XF);
      ly.style.zIndex = i + 1;
      const p = Math.min(1, Math.max(0, (t - x.start) / d)), f = x.framing || {};
      if (f.fit === 'scroll') {
        const q = f.dir === 'back' ? 1 - p : p, im = ly.querySelector('img.sc');
        if (im) im.style.objectPosition = (ratio[i] ?? 1) < 16 / 9 ? `50% ${q * 100}%` : `${q * 100}% 50%`;
        ly.style.transform = '';
      } else {
        const a = f.fit === 'cover' ? (f.fx ?? .5) : .5, b = f.fit === 'cover' ? (f.fy ?? .5) : .5;
        const [z, ox, oy] = (KB[x.effect] || KB.static)(p, tl.zoom, a, b);
        ly.style.transformOrigin = `${ox * 100}% ${oy * 100}%`; ly.style.transform = `scale(${z})`;
      }
    }
    const dur = tl.duration;
    $('#lpB').style.opacity = t < 0.5 ? 1 - t / 0.5 : t > dur - 0.6 ? Math.min(1, (t - (dur - 0.6)) / 0.6) : 0;
    $('#lpT').style.opacity = tl.titles && t < 4 ? (t < .6 ? t / .6 : t < 3.4 ? 1 : (4 - t) / .6) : 0;
    $('#lpI').textContent = `${sh[cur].id} · ${sh[cur].effect}${sh[cur].transition ? ' · chuyển: ' + sh[cur].transition : ''}`;
    $('#lpC').textContent = `${fmt(t)} / ${fmt(to)}`;
    $('#lpR').value = t;
  };
  let clock = from, last = null;  // the voice drives the clock; the part's end gap continues on a timer
  const loop = now => {
    if (me.stop || !$('#lp')) { audio.pause(); return; }
    if (me.playing) {
      if (!audio.paused && !audio.ended) clock = audio.currentTime;
      else if (last != null) clock += (now - last) / 1000;
      if (clock >= to) { me.playing = false; audio.pause(); clock = to; $('#lpP').textContent = '▶'; }
    }
    last = now;
    draw(clock);
    requestAnimationFrame(loop);
  };
  const play = () => {
    if (clock >= to - 0.05) clock = from;
    me.playing = true; $('#lpP').textContent = '⏸';
    if (!audio.duration || clock < audio.duration) { audio.currentTime = clock; audio.play().catch(() => {}); }
  };
  const pause = () => { me.playing = false; audio.pause(); $('#lpP').textContent = '▶'; };
  $('#lpP').onclick = () => me.playing ? pause() : play();
  $('#lpR').oninput = e => { clock = +e.target.value; if (audio.duration && clock < audio.duration) audio.currentTime = clock; };
  draw(from); requestAnimationFrame(loop);
  audio.addEventListener('loadedmetadata', () => { if (!me.stop) play(); }, {once: true});
}
async function preview(what) {
  const label = what.scene ? `cảnh ${what.scene}` : `part ${what.part}`;
  modal(`<div class="mh row"><b>🎬 Xem thử ${label}</b><span class="muted" style="font-size:12px">480p nháp — dùng cài đặt ở tab ③ Render</span></div>
    <div class="mb"><div id="pvBox"></div></div>`);
  try {
    const job = await api(`${P()}/preview`, {method: 'POST', json: {...renderOpts(), ...what}});
    watchJob(job, '#pvBox', async () => {
      const j = await api(`/api/jobs/${job.id}`);
      const box = $('#pvBox'); if (!box) return;
      box.innerHTML = `<video controls autoplay src="${j.result}" style="width:100%;border-radius:8px;background:#000"></video>
        <div class="row" style="margin-top:10px"><button onclick="preview(${esc(JSON.stringify(what))})">↻ Xem thử lại</button>
        <button onclick="closeModal()">Đóng</button></div>`;
    });
  } catch (e) { toast(e.message); }
}
async function doRender() {
  const job = await api(`${P()}/render`, {method: 'POST', json: renderOpts()});
  watchJob(job, '#jobBox', () => { toast('Render xong!'); refresh(); });
}

  const bs = await api('/api/browser/status');
  $('#main').innerHTML = `
  <div class="card"><h2>🌐 Trình duyệt cho Gemini / ChatGPT / Grok (web)</h2>
    <p class="muted">Mỗi trang AI có thể chạy trên trình duyệt riêng (vd Gemini trên Edge, ChatGPT trên Brave). Trình duyệt được app
      điều khiển phải dùng <b>profile riêng</b> (Chrome/Brave/Edge chặn điều khiển profile mặc định) → đăng nhập <b>1 lần</b> trong cửa sổ app mở.</p>
    <table><tr><th>Trang</th><th>Trình duyệt</th><th>Cổng</th><th>Thư mục profile</th><th>Trạng thái</th><th></th></tr>
    ${['gemini', 'chatgpt', 'grok'].map(s => { const st = bs.sites[s], U = s.toUpperCase(), own = !!k[U + '_CDP_PORT'];
      return `<tr><td><b>${s}</b></td>
        <td><select data-site="${s}" onchange="setSiteBrowser('${s}',this.value)">
          <option value="" ${own ? '' : 'selected'}>Dùng chung (${esc((bs.browser || '').split(/[\\/]/).pop())})</option>
          ${bs.brave ? `<option value="brave" ${own && /brave/i.test(k[U + '_BROWSER_PATH']) ? 'selected' : ''}>Brave (riêng)</option>` : ''}
          <option value="chrome" ${own && /chrome/i.test(k[U + '_BROWSER_PATH']) ? 'selected' : ''}>Chrome (riêng)</option>
          <option value="edge" ${own && /msedge/i.test(k[U + '_BROWSER_PATH']) ? 'selected' : ''}>Edge (riêng)</option></select></td>
        <td>${st.port}</td><td class="muted" style="font-size:12px;word-break:break-all">${esc(st.profile)}</td>
        <td>${st.alive ? '<span class="tag ok">đang chạy</span>' : '<span class="tag bad">chưa mở</span>'}</td>
        <td><button onclick="openBrowser(this,['${s}'])">Mở để đăng nhập</button></td></tr>`; }).join('')}</table>
    <div class="row" style="margin-top:10px"><button class="primary" onclick="openBrowser(this)">Mở cả 3 trang để đăng nhập</button></div></div>
  <div class="card"><h2>Nguồn ảnh</h2><table>
    ${Object.entries(S.settings.sources).map(([id, v]) => `<tr><td>${esc(v.label)}</td><td>${v.kind === 'ai' ? 'AI tạo ảnh' : 'Tìm ảnh'}</td>
      <td>${v.enabled ? '<span class="tag ok">sẵn sàng</span>' : `<span class="tag bad">cần ${v.needs.join(' + ')}</span> ${keyLink(v.needs, v.label)}`}</td></tr>`).join('')}</table></div>
  <div class="card"><h2>API keys</h2><p class="muted">Lưu cục bộ trong vidgen/settings.json. Wikimedia & Openverse không cần key.</p>
    <div class="form-grid">${Object.keys(k).filter(n => !/^(GEMINI|CHATGPT|GROK)_(BROWSER_PATH|CDP_PORT|USER_DATA_DIR|PROFILE)$/.test(n)).map(n => `<label>${n}<input data-k="${n}" value="${esc(k[n])}" placeholder="${esc(help[n] || '')}"></label>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="primary" onclick="saveKeys()">Lưu</button></div></div>`;
}
const BROWSER_EXE = {brave: 'C:/Program Files/BraveSoftware/Brave-Browser/Application/brave.exe',
  chrome: 'C:/Program Files/Google/Chrome/Application/chrome.exe', edge: 'C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe'};
async function setSiteBrowser(site, which) {
  const U = site.toUpperCase(), ports = {gemini: 9224, chatgpt: 9223, grok: 9225};
  const d = which ? {[U + '_BROWSER_PATH']: BROWSER_EXE[which], [U + '_CDP_PORT']: String(ports[site])}
                  : {[U + '_BROWSER_PATH']: '', [U + '_CDP_PORT']: '', [U + '_USER_DATA_DIR']: '', [U + '_PROFILE']: ''};
  try { S.settings = await api('/api/settings', {method: 'PUT', json: d}); toast(which ? `${site}: ${which} riêng — bấm "Mở để đăng nhập"` : `${site}: dùng trình duyệt chung`); renderSettings(); }
  catch (e) { toast(e.message); }
}
async function openBrowser(btn, sites) {
  btn.disabled = true; btn.textContent = 'Đang mở…';
  try { await api('/api/browser/open', {method: 'POST', json: {sites: sites || null}}); toast('Đã mở — đăng nhập trong cửa sổ đó (chỉ cần 1 lần)'); }
  catch (e) { toast(e.message, 8000); }
  renderSettings();
}
const KEY_HELP = {  // name: [what / where, link to get it, free?]
  YOUTUBE_API_KEY: ['YouTube Data API v3 — miễn phí 10.000 đơn vị/ngày (≈ 100 lần kiểm tra chủ đề)', 'https://console.cloud.google.com/apis/library/youtube.googleapis.com'],
  GEMINI_API_KEY: ['Google AI Studio — có gói miễn phí, dùng cho viết kịch bản / gợi ý / tạo ảnh qua API', 'https://aistudio.google.com/apikey'],
  OPENAI_API_KEY: ['OpenAI Platform — trả phí theo lượt dùng', 'https://platform.openai.com/api-keys'],
  GOOGLE_CSE_KEY: ['Google Custom Search API key', 'https://console.cloud.google.com/apis/library/customsearch.googleapis.com'],
  GOOGLE_CSE_CX: ['Search engine ID (bật "Image search")', 'https://programmablesearchengine.google.com/controlpanel/all'],
  FLICKR_API_KEY: ['Flickr — miễn phí', 'https://www.flickr.com/services/apps/create/'],
  PEXELS_API_KEY: ['Pexels — miễn phí', 'https://www.pexels.com/api/'],
  PIXABAY_API_KEY: ['Pixabay — miễn phí (key hiện sau khi đăng nhập)', 'https://pixabay.com/api/docs/'],
  UNSPLASH_ACCESS_KEY: ['Unsplash — miễn phí (Access Key)', 'https://unsplash.com/oauth/applications'],

  GEMINI_IMAGE_MODEL: ['mặc định gemini-2.5-flash-image'], GEMINI_TEXT_MODEL: ['mặc định gemini-2.5-flash'],
  BROWSER_CDP_PORT: ['9222 (trùng Flow MCP để dùng chung)'], BROWSER_PATH: ['tự dò Chrome/Edge'],

/* Ask for missing API keys right where they are needed; then(after) runs once they are saved. */
function askKey(names, why, after) {
  names = [].concat(names);
  modal(`<div class="mh"><b>🔑 Cần API key</b>${why ? ` <span class="muted">— ${esc(why)}</span>` : ''}</div><div class="mb">
    ${names.map(n => { const [t, url] = KEY_HELP[n] || ['']; return `<label style="display:block;margin-bottom:12px"><b>${n}</b>
      <span class="muted" style="font-size:12px"> ${esc(t)}</span>
      ${url ? `<br><span style="font-size:12px">Lấy key tại: <a href="${url}" target="_blank">${url}</a></span>` : ''}
      <input data-ak="${n}" style="width:100%;margin-top:4px" placeholder="dán key vào đây"></label>`; }).join('')}
    <p class="muted" style="font-size:12px">Key chỉ lưu trên máy này (vidgen/settings.json), không đẩy lên GitHub.</p>
    <div class="row"><button class="primary" onclick="saveAskKey()">Lưu & tiếp tục</button><button onclick="closeModal()">Huỷ</button></div></div>`);
  S.afterKey = after;
  setTimeout(() => document.querySelector('[data-ak]')?.focus(), 50);
}
async function saveAskKey() {
  const d = {}; document.querySelectorAll('[data-ak]').forEach(i => { if (i.value.trim()) d[i.dataset.ak] = i.value.trim(); });
  if (!Object.keys(d).length) return toast('Chưa nhập key');
  try { S.settings = await api('/api/settings', {method: 'PUT', json: d}); closeModal(); toast('Đã lưu key');
        const f = S.afterKey; S.afterKey = null; f && f(); }
  catch (e) { toast(e.message); }
}
function keyLink(names, why, after) {  // small "🔑 thêm key" link for a locked feature
  return `<a href="#" style="font-size:12px" onclick="event.preventDefault();event.stopPropagation();askKey(${esc(JSON.stringify([].concat(names)))},
    ${esc(JSON.stringify(why || ''))},${after || 'refresh'})">🔑 thêm key</a>`;
}
async function saveKeys() {
  const d = {}; document.querySelectorAll('[data-k]').forEach(i => d[i.dataset.k] = i.value);
  S.settings = await api('/api/settings', {method: 'PUT', json: d}); toast('Đã lưu'); renderSettings();
